<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="kbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="rgbGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="20%" stop-color="#f59e0b"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="80%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="kbShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#kbBg)"/>
  
  <!-- RGB Underglow Ambient Light -->
  <rect x="70" y="80" width="460" height="230" rx="20" fill="url(#rgbGlow)" opacity="0.3" filter="url(#kbShadow)"/>
  
  <!-- Keyboard Chassis Frame -->
  <rect x="80" y="90" width="440" height="210" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="92" y="102" width="416" height="186" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Row 1: Function Keys -->
  <g fill="#334155" stroke="#475569" stroke-width="0.8">
    <rect x="104" y="112" width="22" height="18" rx="3"/>
    <rect x="132" y="112" width="22" height="18" rx="3"/>
    <rect x="160" y="112" width="22" height="18" rx="3"/>
    <rect x="188" y="112" width="22" height="18" rx="3"/>
    <rect x="220" y="112" width="22" height="18" rx="3"/>
    <rect x="248" y="112" width="22" height="18" rx="3"/>
    <rect x="276" y="112" width="22" height="18" rx="3"/>
    <rect x="304" y="112" width="22" height="18" rx="3"/>
    <rect x="336" y="112" width="22" height="18" rx="3"/>
    <rect x="364" y="112" width="22" height="18" rx="3"/>
    <rect x="392" y="112" width="22" height="18" rx="3"/>
    <rect x="420" y="112" width="22" height="18" rx="3"/>
    <rect x="450" y="112" width="46" height="18" rx="3" fill="#2563eb"/>
  </g>
  
  <!-- Row 2: Numbers with RGB Glow -->
  <g fill="#1e293b" stroke="#3b82f6" stroke-width="1">
    <rect x="104" y="138" width="24" height="22" rx="4"/>
    <rect x="134" y="138" width="24" height="22" rx="4"/>
    <rect x="164" y="138" width="24" height="22" rx="4"/>
    <rect x="194" y="138" width="24" height="22" rx="4"/>
    <rect x="224" y="138" width="24" height="22" rx="4"/>
    <rect x="254" y="138" width="24" height="22" rx="4"/>
    <rect x="284" y="138" width="24" height="22" rx="4"/>
    <rect x="314" y="138" width="24" height="22" rx="4"/>
    <rect x="344" y="138" width="24" height="22" rx="4"/>
    <rect x="374" y="138" width="24" height="22" rx="4"/>
    <rect x="404" y="138" width="24" height="22" rx="4"/>
    <rect x="434" y="138" width="62" height="22" rx="4" fill="#7c3aed" stroke="#a855f7"/>
  </g>
  
  <!-- Row 3: QWERTY Row -->
  <g fill="#1e293b" stroke="#06b6d4" stroke-width="1">
    <rect x="104" y="166" width="34" height="22" rx="4" fill="#334155"/>
    <rect x="144" y="166" width="24" height="22" rx="4"/>
    <rect x="174" y="166" width="24" height="22" rx="4"/>
    <rect x="204" y="166" width="24" height="22" rx="4"/>
    <rect x="234" y="166" width="24" height="22" rx="4"/>
    <rect x="264" y="166" width="24" height="22" rx="4"/>
    <rect x="294" y="166" width="24" height="22" rx="4"/>
    <rect x="324" y="166" width="24" height="22" rx="4"/>
    <rect x="354" y="166" width="24" height="22" rx="4"/>
    <rect x="384" y="166" width="24" height="22" rx="4"/>
    <rect x="414" y="166" width="24" height="22" rx="4"/>
    <rect x="444" y="166" width="52" height="22" rx="4" fill="#334155"/>
  </g>
  
  <!-- Row 4: ASDFG Row with Highlighted Gaming WASD Keys -->
  <g fill="#1e293b" stroke="#10b981" stroke-width="1">
    <rect x="104" y="194" width="42" height="22" rx="4" fill="#334155"/>
    <!-- A Key (Cyan Accent) -->
    <rect x="152" y="194" width="24" height="22" rx="4" fill="#2563eb" stroke="#60a5fa" stroke-width="1.5"/>
    <!-- S Key (Cyan Accent) -->
    <rect x="182" y="194" width="24" height="22" rx="4" fill="#2563eb" stroke="#60a5fa" stroke-width="1.5"/>
    <!-- D Key (Cyan Accent) -->
    <rect x="212" y="194" width="24" height="22" rx="4" fill="#2563eb" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="242" y="194" width="24" height="22" rx="4"/>
    <rect x="272" y="194" width="24" height="22" rx="4"/>
    <rect x="302" y="194" width="24" height="22" rx="4"/>
    <rect x="332" y="194" width="24" height="22" rx="4"/>
    <rect x="362" y="194" width="24" height="22" rx="4"/>
    <rect x="392" y="194" width="24" height="22" rx="4"/>
    <rect x="422" y="194" width="74" height="22" rx="4" fill="#ec4899" stroke="#f472b6"/>
  </g>
  
  <!-- Row 5: Shift & ZXCVBNM Row -->
  <g fill="#1e293b" stroke="#f59e0b" stroke-width="1">
    <rect x="104" y="222" width="52" height="22" rx="4" fill="#334155"/>
    <rect x="162" y="222" width="24" height="22" rx="4"/>
    <rect x="192" y="222" width="24" height="22" rx="4"/>
    <rect x="222" y="222" width="24" height="22" rx="4"/>
    <rect x="252" y="222" width="24" height="22" rx="4"/>
    <rect x="282" y="222" width="24" height="22" rx="4"/>
    <rect x="312" y="222" width="24" height="22" rx="4"/>
    <rect x="342" y="222" width="24" height="22" rx="4"/>
    <rect x="372" y="222" width="24" height="22" rx="4"/>
    <rect x="402" y="222" width="94" height="22" rx="4" fill="#334155"/>
  </g>
  
  <!-- Row 6: Bottom Row & Spacebar -->
  <g fill="#334155" stroke="#64748b" stroke-width="1">
    <rect x="104" y="250" width="30" height="24" rx="4"/>
    <rect x="140" y="250" width="30" height="24" rx="4"/>
    <rect x="176" y="250" width="30" height="24" rx="4"/>
    <!-- Spacebar with RGB Underglow -->
    <rect x="212" y="250" width="180" height="24" rx="5" fill="#1e293b" stroke="url(#rgbGlow)" stroke-width="1.8"/>
    <rect x="398" y="250" width="30" height="24" rx="4"/>
    <rect x="434" y="250" width="30" height="24" rx="4"/>
    <rect x="470" y="250" width="26" height="24" rx="4" fill="#2563eb"/>
  </g>
  
  <!-- Gaming Mouse beside Keyboard -->
  <g transform="translate(480, 240)">
    <path d="M 15 10 C 25 -10, 45 -10, 55 10 C 65 30, 60 70, 35 75 C 10 70, 5 30, 15 10 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="35" y1="5" x2="35" y2="30" stroke="#64748b" stroke-width="1"/>
    <circle cx="35" cy="22" r="4" fill="#38bdf8"/>
  </g>
  
  <!-- Text Label -->
  <text x="300" y="375" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="1">AEROMECH PRO RGB MECHANICAL KEYBOARD</text>
</svg>
