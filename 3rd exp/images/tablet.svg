<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern Lines -->
  <circle cx="300" cy="200" r="160" fill="none" stroke="#2563eb" stroke-opacity="0.15" stroke-width="1.5"/>
  <circle cx="300" cy="200" r="220" fill="none" stroke="#7c3aed" stroke-opacity="0.1" stroke-width="1.5"/>
  
  <!-- Tablet Body Shadow -->
  <rect x="140" y="55" width="320" height="290" rx="22" fill="#000000" opacity="0.45" filter="url(#glow)"/>
  
  <!-- Tablet Bezel Frame -->
  <rect x="140" y="50" width="320" height="290" rx="22" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
  
  <!-- Front Camera Dot -->
  <circle cx="300" cy="62" r="3" fill="#38bdf8"/>
  
  <!-- Screen Display with vibrant gradient wallpaper -->
  <rect x="156" y="74" width="288" height="248" rx="12" fill="url(#screenGrad)"/>
  
  <!-- Stylized App Icons / UI on Tablet Screen -->
  <rect x="180" y="96" width="36" height="36" rx="8" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="232" y="96" width="36" height="36" rx="8" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="284" y="96" width="36" height="36" rx="8" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="336" y="96" width="36" height="36" rx="8" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="388" y="96" width="36" height="36" rx="8" fill="#ffffff" fill-opacity="0.25"/>
  
  <!-- Widget on Screen -->
  <rect x="180" y="150" width="140" height="80" rx="10" fill="#ffffff" fill-opacity="0.2"/>
  <rect x="336" y="150" width="88" height="80" rx="10" fill="#ffffff" fill-opacity="0.2"/>
  
  <!-- Dock Bar -->
  <rect x="210" y="292" width="180" height="20" rx="10" fill="#000000" fill-opacity="0.3"/>
  <circle cx="240" cy="302" r="6" fill="#ffffff" fill-opacity="0.7"/>
  <circle cx="270" cy="302" r="6" fill="#ffffff" fill-opacity="0.7"/>
  <circle cx="300" cy="302" r="6" fill="#ffffff" fill-opacity="0.7"/>
  <circle cx="330" cy="302" r="6" fill="#ffffff" fill-opacity="0.7"/>
  <circle cx="360" cy="302" r="6" fill="#ffffff" fill-opacity="0.7"/>
  
  <!-- Digital Stylus Pen -->
  <g transform="rotate(35 480 200)">
    <rect x="470" y="100" width="10" height="180" rx="5" fill="url(#penGrad)" stroke="#64748b" stroke-width="1"/>
    <polygon points="470,280 480,280 475,295" fill="#0f172a"/>
    <circle cx="475" cy="115" r="2" fill="#38bdf8"/>
  </g>
  
  <!-- Text Label -->
  <text x="300" y="375" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#93c5fd" text-anchor="middle" letter-spacing="1">MVERSE PAD ULTRA 11" 2K OLED</text>
</svg>
